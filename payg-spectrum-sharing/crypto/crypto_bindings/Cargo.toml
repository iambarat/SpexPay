[package]
name = "payg_bbs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "payg_bbs"
crate-type = ["cdylib"]

[dependencies]
# pyo3 = "0.25.0"
pyo3 = { version = "0.22", features = ["extension-module"] }

# Dock crypto crates (BBS+, composite proof system)
bbs-plus = { package = "bbs_plus", version = "0.25", default-features = false, features = ["bls12_381"] }
proof-system = { package = "proof_system", version = "0.25", default-features = false, features = ["bls12_381"] }

# Group/curve deps implicitly via the above (arkworks / bls12_381)
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"