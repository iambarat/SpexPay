[package]
name = "payg_bbs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "crypto_bindings"
crate-type = ["cdylib"]

[dependencies]
# proof_system = "0.34.0"
# pyo3 = "0.25.0"

pyo3 = { version = "0.22", features = ["extension-module"] }

# Dock crates
bbs-plus     = { git = "https://github.com/docknetwork/crypto", package = "bbs_plus" }
proof-system = { git = "https://github.com/docknetwork/crypto", package = "proof_system", default-features = true }
dock-crypto-utils = { git = "https://github.com/docknetwork/crypto", package = "dock_crypto_utils" }



# Group/curve deps implicitly via the above (arkworks / bls12_381)
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
hex = "0.4"
once_cell = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake2 = "0.10"
